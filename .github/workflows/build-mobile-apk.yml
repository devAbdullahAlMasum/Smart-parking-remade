name: Build Mobile APK (Capacitor)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Java (Android Compiler)
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        working-directory: .
        run: |
          rm -f pnpm-lock.yaml
          pnpm install

      - name: Build web app
        run: pnpm build

      - name: Install Capacitor Android platform
        run: pnpm add @capacitor/android

      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Bump minSdkVersion to 26 (required by barcode scanner)
        run: |
          sed -i 's/minSdkVersion[ =]*[0-9]\+/minSdkVersion 26/' android/app/build.gradle android/variables.gradle 2>/dev/null || true
          echo "Updated minSdkVersion in:"
          grep -n "minSdkVersion" android/app/build.gradle android/variables.gradle 2>/dev/null || true

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-parking-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
