<!DOCTYPE html><html class="dark" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>EmptySpot - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#fff4dc",
                        "divider": "#757575",
                        "on-secondary-fixed-variant": "#564500",
                        "surface-tint": "#ebc313",
                        "status-warning": "#FFB800",
                        "on-error": "#690005",
                        "surface-container-low": "#1f1b11",
                        "text-muted": "#A3A3A3",
                        "error": "#ffb4ab",
                        "surface-bright": "#3d392d",
                        "on-error-container": "#ffdad6",
                        "on-background": "#eae2d1",
                        "outline": "#999079",
                        "tertiary-fixed": "#81f4ff",
                        "surface-variant": "#393429",
                        "primary-fixed-dim": "#ebc313",
                        "primary-fixed": "#ffe17b",
                        "secondary-fixed": "#ffe081",
                        "text-primary": "#FFFFFF",
                        "text-secondary": "#D1D1D1",
                        "on-tertiary": "#00363b",
                        "secondary-container": "#caa500",
                        "inverse-on-surface": "#343025",
                        "surface": "#161309",
                        "surface-card": "#555555",
                        "tertiary-container": "#06efff",
                        "tertiary-fixed-dim": "#00dbea",
                        "tertiary": "#d9fbff",
                        "on-surface": "#eae2d1",
                        "surface-container-highest": "#393429",
                        "on-primary-fixed-variant": "#564500",
                        "on-primary-fixed": "#231b00",
                        "on-primary": "#3b2f00",
                        "on-tertiary-container": "#006970",
                        "border-low": "#6A6A6A",
                        "inverse-primary": "#715c00",
                        "surface-elevated": "#606060",
                        "secondary-fixed-dim": "#ebc32d",
                        "surface-primary": "#434343",
                        "secondary": "#ebc32d",
                        "on-primary-container": "#715c00",
                        "background": "#161309",
                        "surface-container": "#231f15",
                        "primary-container": "#ffd52d",
                        "surface-container-lowest": "#110e05",
                        "status-maintenance": "#8A8A8A",
                        "surface-secondary": "#4D4D4D",
                        "on-tertiary-fixed": "#002022",
                        "on-surface-variant": "#d0c6ac",
                        "on-secondary-fixed": "#231b00",
                        "surface-container-high": "#2e2a1f",
                        "on-tertiary-fixed-variant": "#004f55",
                        "on-secondary-container": "#4b3c00",
                        "on-secondary": "#3c2f00",
                        "surface-dim": "#161309",
                        "inverse-surface": "#eae2d1",
                        "error-container": "#93000a",
                        "outline-variant": "#4d4633",
                        "status-occupied": "#FF6B57"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-desktop": "32px",
                        "touch-target": "48px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "section-heading": ["Inter"],
                        "headline-lg": ["Inter"],
                        "card-title": ["Inter"],
                        "body-reg": ["Inter"],
                        "stat-display": ["JetBrains Mono"],
                        "caption": ["Inter"],
                        "label-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "section-heading": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "card-title": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-reg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "stat-display": ["24px", {"lineHeight": "32px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "label-mono": ["11px", {"lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #161309; }
        .bg-industrial { background-color: #434343; }
        .text-safety-yellow { color: #FFD52D; }
        .bg-safety-yellow { background-color: #FFD52D; }
    </style>
</head>
<body class="bg-background text-text-primary font-body-reg min-h-screen flex flex-col antialiased">
<!-- Main Content -->
<main class="flex-grow px-margin-mobile py-8 pb-28 space-y-8">
<!-- Logo & Greeting -->
<section class="space-y-4">
<div class="space-y-1">
</div>
</section>
<!-- Quick Actions -->
<!-- Active Parking (Top Priority) -->
<div class="space-y-3"><h3 class="font-section-heading text-sm text-text-muted uppercase tracking-widest px-1">Active Session</h3><section><div class="bg-surface-container border border-outline-variant/30 rounded-xl p-4 shadow-xl flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-safety-yellow rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-surface-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<div>
<h4 class="font-card-title text-lg font-semibold text-text-primary">BMW i8</h4>
<p class="font-label-mono text-label-mono text-safety-yellow mt-1">PARKED UNTIL 1:15 PM</p>
</div>
</div>
<button class="font-label-mono text-label-mono text-text-primary border border-outline-variant px-3 py-1.5 rounded-lg bg-surface-variant hover:text-safety-yellow transition-colors uppercase">Extend</button>
</div></section></div>
<!-- Favorite Locations -->
<section class="space-y-3">
<h3 class="font-section-heading text-sm text-text-muted uppercase tracking-widest px-1">Favorite Locations</h3>
<div class="space-y-2">
<!-- Compact Card 1 -->
<div class="bg-surface-container border border-outline-variant/30 rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 bg-surface-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg">location_on</span>
</div>
<div>
<p class="font-card-title text-sm text-text-primary">Central Plaza</p>
<p class="font-caption text-text-muted text-[11px]">Level 2 • Aisle B</p>
</div>
</div>
<div class="text-right w-24">
<div class="flex justify-between items-center mb-1">
<span class="font-label-mono text-[10px] text-text-muted">85% FULL</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-status-warning w-[85%]"></div>
</div>
</div>
</div>
<!-- Compact Card 2 -->
<div class="bg-surface-container border border-outline-variant/30 rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 bg-surface-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg">location_on</span>
</div>
<div>
<p class="font-card-title text-sm text-text-primary">North Station</p>
<p class="font-caption text-text-muted text-[11px]">Basement 1</p>
</div>
</div>
<div class="text-right w-24">
<div class="flex justify-between items-center mb-1">
<span class="font-label-mono text-[10px] text-text-muted">95% FULL</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-status-occupied w-[95%]"></div>
</div>
</div>
</div>
<!-- Compact Card 3 -->
<div class="bg-surface-container border border-outline-variant/30 rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 bg-surface-variant rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-lg">location_on</span>
</div>
<div>
<p class="font-card-title text-sm text-text-primary">West Mall</p>
<p class="font-caption text-text-muted text-[11px]">Rooftop Deck</p>
</div>
</div>
<div class="text-right w-24">
<div class="flex justify-between items-center mb-1">
<span class="font-label-mono text-[10px] text-text-muted">30% FULL</span>
</div>
<div class="h-1.5 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-status-maintenance w-[30%]"></div>
</div>
</div>
</div>
</div>
</section><section class="pt-4"><button class="bg-safety-yellow text-surface-primary font-card-title text-sm h-12 w-full rounded flex items-center justify-center gap-2 active:scale-95 transition-transform uppercase tracking-wider"><span class="material-symbols-outlined text-xl">add_circle</span>New Booking</button></section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="bg-surface-container fixed bottom-0 w-full z-50 border-t border-outline-variant shadow-[0_-4px_12px_rgba(0,0,0,0.5)]"><div class="flex justify-around items-center w-full px-2 py-3 bg-background">
<button class="flex flex-col items-center justify-center text-safety-yellow transition-transform active:scale-90">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-caption text-[10px] font-semibold mt-1 uppercase tracking-tighter">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:opacity-100 transition-all active:scale-90">
<span class="material-symbols-outlined">notifications</span>
<span class="font-caption text-[10px] mt-1 uppercase tracking-tighter">Notifications</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-60 hover:opacity-100 transition-all active:scale-90">
<span class="material-symbols-outlined">person</span>
<span class="font-caption text-[10px] mt-1 uppercase tracking-tighter">Profile</span>
</button>
</div></nav>












</body></html>
